name: Telegram live validation (temporary)

on:
  push:
    branches: [verify/telegram-rich-live]

permissions:
  contents: read

jobs:
  telegram-live:
    runs-on: ubuntu-latest
    environment: STOCK_LIST
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Check existing Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import sys
          missing = [key for key in ('TELEGRAM_BOT_TOKEN', 'TELEGRAM_CHAT_ID') if not os.getenv(key)]
          if missing:
              print('::error::Live validation blocked: missing existing Actions Secrets: ' + ', '.join(missing))
              sys.exit(1)
          print('Existing Telegram configuration is available; values are not logged.')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Deliver short and long Markdown reports to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_MESSAGE_THREAD_ID: ${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}
        run: python scripts/telegram_live_validation.py
